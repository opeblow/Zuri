services:
  - type: web
    name: zuri-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: JWT_SECRET
        generateValue: true
      - key: MONNIFY_BASE_URL
        value: "https://sandbox.monnify.com"
      # Set these in the Render dashboard (never hardcode secrets):
      # MONNIFY_API_KEY, MONNIFY_SECRET_KEY, MONNIFY_CONTRACT_CODE,
      # MONNIFY_WALLET_ACCOUNT_NUMBER, OPENAI_API_KEY
