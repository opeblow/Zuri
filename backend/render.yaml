services:
  - type: web
    name: zuri-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://zuri-sooty.vercel.app"
      # Set OPENAI_API_KEY and MONNIFY_* in the Render dashboard (secrets).
