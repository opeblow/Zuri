services:
  - type: web
    name: zuri-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard (never hardcode secrets):
      # OPENAI_API_KEY, ALLOWED_ORIGINS
